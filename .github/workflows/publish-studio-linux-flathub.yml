name: Publish Studio Desktop for Linux in Flathub

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ Publish Studio Desktop ]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-flathub:
    name: Deploy in Flathub
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Flatpak and Flathub
        run: |
          sudo apt-get update
          sudo apt-get install flatpak -y
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install flathub org.freedesktop.Sdk//24.08 -y --noninteractive 
          sudo flatpak install flathub org.freedesktop.Sdk.Extension.dotnet10//24.08 -y --noninteractive 
      - name: Checkout the target repository
        uses: actions/checkout@v4
        with:
          repository: flathub/com.one_ware.OneWare
          token: ${{ secrets.HENDRIK_PERSONAL_TOKEN }}
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: source-repo
          submodules: recursive
      - uses: mavrosxristoforos/get-xml-info@2.0
        name: Get Version
        id: get-oneware-version
        with:
          xml-file: 'source-repo/build/props/Base.props'
          xpath: "//*[local-name()='Project']/*[local-name()='PropertyGroup']/*[local-name()='StudioVersion']"
      - name: Update Nuget Sources
        run: |
          curl -o flatpak-dotnet-generator.py https://raw.githubusercontent.com/one-ware/OneWare/refs/heads/main/flatpak-dotnet-generator.py
          chmod +x flatpak-dotnet-generator.py
          ./flatpak-dotnet-generator.py oneware-nuget-sources.json ./source-repo/studio/OneWare.Studio.Desktop/OneWare.Studio.Desktop.csproj -d 10 -f 24.08 -r linux-x64 linux-arm64
          rm -f flatpak-dotnet-generator.py      
      - name: Update Copilot Runtime Sources
        # Flathub builds are offline, so the Copilot runtime bundled by GitHub.Copilot.SDK is provided as a
        # source and passed to the build with -p:CopilotRuntimeArchive=$PWD/copilot-runtime.tgz.
        run: |
          SDK_VERSION=$(grep -oP 'Include="GitHub.Copilot.SDK" Version="\K[^"]+' source-repo/build/props/GitHub.Copilot.SDK.props)
          curl -sSfL -o copilot-sdk.nupkg "https://api.nuget.org/v3-flatcontainer/github.copilot.sdk/${SDK_VERSION}/github.copilot.sdk.${SDK_VERSION}.nupkg"
          CLI_VERSION=$(unzip -p copilot-sdk.nupkg build/GitHub.Copilot.SDK.props | grep -oP '<CopilotCliVersion>\K[^<]+')
          curl -sSfL -o copilot-sha256sums.txt "https://github.com/github/copilot-cli/releases/download/v${CLI_VERSION}/SHA256SUMS.txt"
          python3 - "$CLI_VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          sums = {}
          for line in open("copilot-sha256sums.txt"):
              parts = line.split()
              if len(parts) == 2:
                  sums[parts[1].lstrip("*")] = parts[0]
          sources = []
          for platform, arch in (("linux-x64", "x86_64"), ("linux-arm64", "aarch64")):
              asset = f"github-copilot-{version}-{platform}.tgz"
              sources.append({
                  "type": "file",
                  "url": f"https://github.com/github/copilot-cli/releases/download/v{version}/{asset}",
                  "sha256": sums[asset],
                  "dest-filename": "copilot-runtime.tgz",
                  "only-arches": [arch],
              })
          json.dump(sources, open("copilot-runtime-sources.json", "w"), indent=2)
          PY
          rm -f copilot-sdk.nupkg copilot-sha256sums.txt
      - name: Delete the source repository
        run: rm -rf source-repo
      - name: Update Version
        run: |
          sed -i "s/tag: .*/tag: ${{ steps.get-oneware-version.outputs.info }}/" com.one_ware.OneWare.yml
          sed -i "s/commit: .*/commit: ${{ github.sha }}/" com.one_ware.OneWare.yml
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add com.one_ware.OneWare.yml
          git add oneware-nuget-sources.json
          git add copilot-runtime-sources.json
          git commit -m "Update OneWare Version"     
      - name: Push changes and create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.HENDRIK_PERSONAL_TOKEN }}
          branch: release-${{ steps.get-oneware-version.outputs.info }}
          title: "Update Version to ${{ steps.get-oneware-version.outputs.info }}"
          body: "This is an automated pull request to update the version to ${{ steps.get-oneware-version.outputs.info }}"
          labels: |
            update
            automated pr
