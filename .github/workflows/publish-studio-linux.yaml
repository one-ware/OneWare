name: Publish Studio Desktop for Linux

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ Publish Studio Desktop ]
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ linux-x64, linux-arm64 ]
    outputs:
      version: ${{ steps.get-oneware-version.outputs.info }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mavrosxristoforos/get-xml-info@2.0
        name: Get Version
        id: get-oneware-version
        with:
          xml-file: './build/props/Base.props'
          xpath: "//*[local-name()='Project']/*[local-name()='PropertyGroup']/*[local-name()='StudioVersion']"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish ./studio/OneWare.Studio.Desktop/OneWare.Studio.Desktop.csproj -c Release -r ${{ matrix.arch }} -o ./out
      - name: Compress
        uses: a7ul/tar-action@v1.2.0
        id: compress
        with:
          command: c
          files: ./
          cwd: ./out
          outPath: ./out/OneWareStudio-${{ steps.get-oneware-version.outputs.info }}-${{ matrix.arch }}.tgz
      - name: Create VersionInfo
        run: echo "${{ steps.get-oneware-version.outputs.info }}|https://cdn.one-ware.com/onewarestudio/${{ steps.get-oneware-version.outputs.info }}/OneWareStudio-${{ steps.get-oneware-version.outputs.info }}-${{ matrix.arch }}.tgz" > ./out/${{ matrix.arch }}.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts-${{ matrix.arch }}
          path: |
            ./out/OneWareStudio-${{ steps.get-oneware-version.outputs.info }}-${{ matrix.arch }}.tgz
            ./out/${{ matrix.arch }}.txt

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download Artifacts (x64)
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts-linux-x64
      - name: Download Artifacts (arm64)
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts-linux-arm64
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.version }}
          artifacts: "*.tgz"
          allowUpdates: true
          omitBodyDuringUpdate: True
          omitNameDuringUpdate: True
          omitPrereleaseDuringUpdate: True
          omitDraftDuringUpdate: True
      - name: Upload to Azure Blob Storage
        env:
          AZURE_STORAGE_ACCOUNT: onewarecdn
          AZURE_STORAGE_KEY: ${{ secrets.ONEWARE_STORAGE_KEY }}
          # Static website container served by Front Door at https://cdn.one-ware.com
          STORAGE_CONTAINER: $web
          CDN_PREFIX: onewarestudio
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          upload() {
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --account-key "$AZURE_STORAGE_KEY" \
              --container-name "$STORAGE_CONTAINER" \
              --name "${CDN_PREFIX}/$2" \
              --file "$1" \
              --content-type "$3" \
              --overwrite \
              --only-show-errors \
              --output none
          }
          # Upload installers before version info so the update pointer never references a missing file
          for arch in linux-x64 linux-arm64; do
            upload "OneWareStudio-${VERSION}-${arch}.tgz" "${VERSION}/OneWareStudio-${VERSION}-${arch}.tgz" "application/gzip"
          done
          for arch in linux-x64 linux-arm64; do
            upload "${arch}.txt" "${arch}.txt" "text/plain; charset=utf-8"
          done
